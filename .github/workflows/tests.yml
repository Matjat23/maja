name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install document, phone and camera packages
        run: python -m pip install chromadb pypdf fastapi uvicorn httpx opencv-python-headless anthropic
      - name: Run unit tests
        run: python -m unittest -v
